services:
  postgres:
    image: postgres:14
    container_name: pg14-pitr

    environment:
      POSTGRES_USER: beyza
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./wal-archive:/wal-archive

    command: >
      postgres
      -c archive_mode=on
      -c archive_command='cp %p /wal-archive/%f'
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=512MB

volumes:
  postgres-data:
